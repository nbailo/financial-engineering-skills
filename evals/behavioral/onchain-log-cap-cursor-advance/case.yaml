id: onchain-log-cap-cursor-advance
skill: fin-onchain
mode: [review, repair]
task: |
  I raised RANGE_SPAN in the deposit indexer from 10 to 50 so the backfill finishes tonight
  rather than over the weekend. That is the whole change. repo/ has the indexer, the node
  client it reads through and a canned chain we test against. Sanity check it before I open
  the PR.
defect:
  summary: Five confirmed deposits worth 77750000 base units are never credited, so three customers pay money in and the balance never moves.
  mechanism: The node returns at most MAX_LOGS_PER_RESPONSE logs and drops the rest without saying so, while sync advances store.cursor to to_block on every response, so the blocks hidden behind the cap are never read again.
  file: repo/indexer.py
expect_findings:
  - id: cursor-advances-past-an-uncovered-range
    must_mention: [MAX_LOGS_PER_RESPONSE, cursor]
    why: The cap lives in node.py and the unconditional advance lives in indexer.py, and neither file is wrong on its own; the money is lost at the join, where a capped response is treated as a covered one.
hard_negatives:
  - Deposits are credited at the chain tip with no confirmation buffer, so a reorg strands a credit; sync stops at the head minus CONFIRMATIONS and leaves the blocks above it alone.
  - A restart re-credits deposits that were already applied; DepositStore.credit keys on block hash, transaction hash and log index, and skips a key it has already seen.
  - Our own sweep and gas movements are credited as customer deposits; is_deposit rejects a log whose sender is one of our internal addresses.
oracle:
  command: python3 oracle/test_oracle.py
  fails_on_defect: true
  passes_on_fix: true
