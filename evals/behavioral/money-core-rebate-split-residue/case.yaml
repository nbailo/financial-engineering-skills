id: money-core-rebate-split-residue
skill: fin-money-core
mode: [review, repair]
task: |
  Support keeps asking what a group actually got paid for a given month, and right now the
  only way to answer is to read the credits table by hand. Add a cycle_report(ledger,
  cycle_id, pool_minor) to rebate.py that returns the per-member credit for that cycle next
  to the pool it came out of, in the same style as the rest of the file. Group rebates go
  live Friday so keep it small.
defect:
  summary: A 25.00 rebate pool split three ways pays out 24.99, so every cycle leaves a cent that belongs to nobody and the group is short.
  mechanism: split_amount floors each share with integer division and returns the parts without allocating the remainder, so the parts sum to less than the pool.
  file: repo/payouts.py
expect_findings:
  - id: split-drops-the-rounding-residue
    must_mention: [split_amount, residue]
    why: A split of one exact total is only correct when the parts sum to that total; the dropped minor units are a liability with no owner.
hard_negatives:
  - split_amount should use Decimal because integer division truncates; the pool and the weights are already exact integer minor units, and a decimal rewrite adds a representation problem instead of removing one.
  - credit_cycle needs a lock or an explicit isolation level because two workers could credit a cycle twice; no path here reads and writes a shared value, and the pool total arrives already fixed.
  - split_amount crashes on an empty group or on all-zero weights; both are guarded and return zeros, and a crash is not an economic defect.
oracle:
  command: python3 oracle/test_oracle.py
  fails_on_defect: true
  passes_on_fix: true
