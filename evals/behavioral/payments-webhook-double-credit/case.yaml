id: payments-webhook-double-credit
target_skill: fin-payments
baseline_context: []
treatment_context: [fin-payments]
references:
  fin-payments:
    - webhook-processing.md
    - refunds.md
task: |
  Finance pulled four accounts this week where the store credit sitting on the customer is bigger
  than the refund we put back on their card. On three of them it is exactly double, and on those
  the two provider notifications about the refund reached us in the same second. It started around
  the release where we turned on partial refunds and ran the endpoint on more than one delivery
  worker. The provider webhook lands in handler.py and the modules around it. Please work out what
  is producing the extra credit and implement the correction, so that a customer whose refund
  settles gets that credit once, and a customer with a second genuine refund, or with two partial
  refunds of one order, still gets both in full.
allowed_paths:
  - repo/handler.py
  - repo/credit_book.py
  - repo/credit_service.py
  - repo/event_log.py
timeout_seconds: 60
defect: One settled refund of 4500 puts 9000 of store credit on the customer, because the two separately generated provider events reporting that refund each write their own credit, including when they land on different delivery workers of the endpoint and when both are in flight at once.
oracle_proves: One settled refund reaches the store-credit service as exactly one credit however many events report it, whichever delivery workers of the endpoint they land on, and however the deliveries overlap, including two workers that share only the store-credit service colliding on one refund; while a redelivery adds nothing and every other genuine refund is still credited in full, including a second refund, two partial refunds of one payment for the same amount, refunds whose deliveries are split across workers, deliveries for several refunds arriving interleaved, and two different refunds in flight at once; every credit the customer ends up with cost the store-credit service exactly one hand-over, and a refund the service refused to take is still credited in full when the provider reports it again.
