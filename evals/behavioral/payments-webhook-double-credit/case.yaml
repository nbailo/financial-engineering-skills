id: payments-webhook-double-credit
skill: fin-payments
mode: [review, repair]
task: |
  Finance pulled four accounts this week where the store credit we handed back is bigger than
  the refund on the order. It started around the release where we turned on partial refunds.
  The webhook path is handler.py and the modules around it. Please sort it out.
defect:
  summary: One settled refund of 4500 puts 9000 of store credit on the customer's account, so the shop gives back twice what it returned to the card.
  mechanism: the only guard is the event id, which stops a redelivery and nothing else, and charge.refunded and refund.updated arrive as two separately generated events with different ids describing the same refund settling, so the credit is applied once per event.
  file: repo/handler.py
expect_findings:
  - id: two-events-one-transition
    must_mention: ["charge.refunded", "refund.updated", "credit"]
    why: the event id dedupes the delivery, while the effect has to be idempotent on the refund object and its transition, and here two distinct event ids carry one refund settling
hard_negatives:
  - The provider signature is not verified in handler.py, which is correct here because the route parses and verifies the body before calling handle(); no verification code is in this repo to get wrong.
  - EventLog holds ids in a set rather than a table. It stands in for the delivery table, and the second credit happens on two ids that are both claimed successfully, so durability is not what produces the extra money.
  - The claim on the delivery and the credit are not written in one transaction. There is no transaction to open in this fixture, and both events are applied cleanly with no crash in the path.
oracle:
  command: python3 oracle/test_oracle.py
  fails_on_defect: true
  passes_on_fix: true
