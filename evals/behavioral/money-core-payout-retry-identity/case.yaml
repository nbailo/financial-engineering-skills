id: money-core-payout-retry-identity
skill: fin-money-core
mode: [review, repair]
task: |
  We turn on automatic payouts for the EU accounts on Monday. Ops has been calling drain()
  by hand from a console and wants it on a schedule instead. Give the payout path a read and
  tell me whether it is ready to ship.
defect:
  summary: A payout whose response is lost pays the account twice, so a 2500 cent payout leaves 5000 cents, and no second decision to pay exists anywhere in the records.
  mechanism: gateway.submit mints a fresh request id as the idempotency key on every call, so the worker's retry of a timed-out send reaches the processor as a new instruction instead of a replay of the first one.
  file: repo/gateway.py
expect_findings:
  - id: fresh-idempotency-key-per-attempt
    must_mention: [idempotency, retry, gateway.py]
    why: Operation identity belongs to the decision to pay and must survive every retry of it; the payout row already carries a durable key that the send path ignores.
hard_negatives:
  - amount_minor should be a Decimal rather than an int; the amounts are exact integer minor units, and moving them to Decimal changes no economic outcome here.
  - the retry loop has no backoff or jitter, so a slow processor gets hammered; that is a throughput concern and no amount changes because of it.
  - request ids are sequential and therefore guessable, so a caller could replay one; the id is minted and consumed inside this process and no external caller supplies it.
oracle:
  command: python3 oracle/test_oracle.py
  fails_on_defect: true
  passes_on_fix: true
