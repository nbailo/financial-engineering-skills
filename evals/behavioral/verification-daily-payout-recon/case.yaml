id: verification-daily-payout-recon
target_skill: fin-verification
baseline_context: [fin-payments]
treatment_context: [fin-payments, fin-verification]
references:
  fin-payments:
    - reconciliation-and-close.md
  fin-verification:
    - reconciliation-design.md
    - reconciliation-breaks.md
task: |
  Finance closed August and cash on hand came out 250.00 higher than the bank. The nightly
  job in reconcile.py compares our payout rows against the processor settlement report, and
  it reported clean every night of the month, so nothing ever reached the alert sink and
  nobody looked until close. Going through the month by hand we also found a 64.25 transfer
  booked against the wrong vendor, a payout our own table holds twice, and a night where the
  report itself lists one transfer on two lines - all of them on nights the job called clean.
  Make every difference between the two sides produce one break record that names what kind
  of difference it is and the amount at stake, and hand each one to the alert sink. A night
  where the two sides agree must still report nothing.
allowed_paths:
  - repo/reconcile.py
timeout_seconds: 60
defect: The nightly run walks only our own payout rows and matches on transfer id alone, so a 250.00 payout only the report holds, a 64.25 transfer paid to a different vendor, and a transfer repeated on either side all read as clean and cash on hand stays overstated by 250.00.
oracle_proves: Over a table of book dates that plants each difference - wrong vendor, duplicated locally, duplicated in the report, ours only, the report's only, and an amount mismatch either way round - on at least two nights at different amounts and under different vendors, including a night whose differences offset so the day's totals tie and a night we wrote no rows at all, every difference yields exactly one break record carrying its amount and a mark that holds across nights and is not shared with another class, each delivered to the alert sink exactly once, while the agreeing book dates yield no break and no alert.
