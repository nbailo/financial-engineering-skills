id: ledger-spend-ignores-hold
skill: fin-ledger
mode: [review, repair]
task: |
  Three customer wallets went negative last week and we covered the shortfall out of the
  float. Support went through them and none of those customers should have been able to
  spend down that far, and there is nothing in the logs that looks like a retry or a
  duplicate charge. Two of the three had a bank withdrawal in flight at the time. Work out
  what happened here and get a fix in before the weekend.
defect:
  summary: A wallet holding 100.00 with an 80.00 bank withdrawal already in flight approves a 50.00 card purchase, so the withdrawal settles into a wallet of minus 30.00 and the platform funds the difference.
  mechanism: authorize() gates the card purchase on posted_balance, which still counts the money request_withdrawal reserved with a live hold; available(), the number that nets live holds out of the posted balance, is consulted by the withdrawal path only.
  file: repo/spending.py
expect_findings:
  - id: card-authorises-on-posted-not-available
    must_mention: [available, hold]
    why: Posted, available and reserved are three different numbers and only available can authorise a new debit; gating on the posted balance lets the same money fund two debits.
hard_negatives:
  - capture_hold posts the debit and leaves the reservation standing, so the customer stays short after the withdrawal settles; it sets the hold to captured in the same call and available counts live holds only, so the reservation stops reserving the moment the posting lands.
  - a hold whose withdrawal is abandoned reserves the funds forever because release depends on the settlement callback; every hold carries expires_on and available ignores a hold past it, so an abandoned reservation stops reserving without any callback running.
  - post() takes no idempotency key, so a retried card authorisation debits the wallet twice; the transaction id is required at the signature and a repeat raises DuplicateTransaction before any leg is written.
oracle:
  command: python3 oracle/test_oracle.py
  fails_on_defect: true
  passes_on_fix: true
