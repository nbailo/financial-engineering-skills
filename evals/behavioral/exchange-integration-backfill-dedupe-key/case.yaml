id: exchange-integration-backfill-dedupe-key
skill: fin-exchange-integration
mode: [review, repair]
task: |
  The user data stream dropped for about four minutes last night. When it came back our
  BTCUSDT readout disagreed with the position the exchange shows, and the morning desk
  flattened by hand off our number. It has happened twice this month, always after a
  reconnect. Work out what the fill pipeline is doing and fix it.
defect:
  summary: Every execution the live stream delivered before a drop is folded into the position a second time when the gap is closed, so the desk trades and reports off a position the venue does not have.
  mechanism: the stream path keys the dedupe on the venue's trade id while the recovery path keys it on a symbol-prefixed string, so the same execution reaches PositionBook under two keys and moves it twice.
  file: repo/backfill.py
expect_findings:
  - id: recovery-and-stream-mint-different-dedupe-keys
    must_mention: ["fill_key", "trade id"]
    why: the dedupe only works when both paths derive the same identity from the venue's own trade id, and reading either file alone shows a key that looks reasonable
hard_negatives:
  - Trade 771 and trade 772 share orderId 990, so one of them is a duplicate. They are two partial executions of one order, each with its own trade id, and both are real quantity.
  - The live stream redelivered the same ORDER_TRADE_UPDATE, so the fix belongs in the stream handler or in at-most-once delivery. The stream path dedupes correctly on its own key; the second copy of the execution enters through the recovery path.
  - The book should hold a long leg and a short leg separately rather than one signed quantity. The venue reports one signed net position per symbol, and the book is keyed the same way so the comparison is possible.
  - The recovery path folds rows in whatever order the pages arrived. It sorts by the venue's own trade id first, which is the economic order the average cost depends on.
oracle:
  command: python3 oracle/test_oracle.py
  fails_on_defect: true
  passes_on_fix: true
