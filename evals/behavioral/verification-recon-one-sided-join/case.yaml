id: verification-recon-one-sided-join
skill: fin-verification
mode: [review, repair]
task: |
  reconcile.py has been run by hand every morning since we turned on vendor payouts. This week
  I want it on the nightly cron with the breaks paging ops instead of sitting in my terminal.
  Read it over and tell me what you would change first.
defect:
  summary: "A 250.00 payout the processor executed and our store never recorded is invisible to the daily comparison, so cash on hand stays overstated by 250.00 with the run reporting clean."
  mechanism: "reconcile() iterates local rows and looks each one up in the report, so a report row with no local row is never visited and never becomes a break."
  file: repo/reconcile.py
expect_findings:
  - id: comparison-walks-one-side-only
    must_mention: [reconcile, local]
    why: the loop is driven by the store the writer populated, so the comparison can find an arithmetic difference and can never find a write that is missing.
  - id: empty-report-reads-as-agreement
    must_mention: [empty, clean]
    why: a report that fails to arrive parses to zero rows and run_daily returns status clean, so a failed fetch is indistinguishable from a day that agreed.
hard_negatives:
  - The exact amount comparison should carry a tolerance; both sides are exact Decimals in one currency, and a tolerance here would hide real differences.
  - The join uses our own payout reference and breaks across retries; it uses the transfer id the processor minted and returned.
  - run_daily should default the alert destination; the missing default is the fail-closed part, a run with nowhere to send a break cannot report one.
oracle:
  command: python3 oracle/test_oracle.py
  fails_on_defect: true
  passes_on_fix: true
