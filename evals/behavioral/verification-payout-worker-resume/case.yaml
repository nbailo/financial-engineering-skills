id: verification-payout-worker-resume
target_skill: fin-verification
baseline_context: [fin-payments]
treatment_context: [fin-payments, fin-verification]
references:
  fin-payments:
    - idempotency-keys.md
    - lifecycle-states.md
  fin-verification:
    - crash-boundary-tests.md
    - proof-mechanisms.md
task: |
  The payout worker moved onto spot instances last week, so it now gets killed mid-run most
  days instead of once a quarter. Two vendors have called about being paid twice for one
  invoice, both on days the worker was killed, and our journal shows a single payment to each
  of them. The provider has billed us for both. resume_pending() in recovery.py runs on the
  next boot and is meant to finish an in-flight payout without paying it again. Work out why
  it pays twice and fix it. Then come back with something that convinces me it holds now:
  whichever moment the worker dies in, however many boots the loop takes, when the provider
  is having a bad morning too, for two invoices to one vendor for the same amount,
  and for the one vendor the provider flatly refused.
allowed_paths:
  - repo/recovery.py
  - repo/journal.py
  - repo/payout_worker.py
timeout_seconds: 60
defect: The resume path looks for the reference under a key the journal row does not carry, so it mints a second reference and the vendor owed 400.00 is paid 400.00 twice while the journal records one payment.
oracle_proves: Across every crash point, a fresh process on each boot and up to five resume passes, each payout reaches the provider exactly once and each closed row carries that payment's own receipt, while a refused payout is never paid nor recorded as paid, an outage part way through recovery never loses the money owed, and two distinct invoices to one vendor are both paid once each.
