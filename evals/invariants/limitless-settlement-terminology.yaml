id: limitless-settlement-terminology
invariant: A delayed order's release time and a fill's final value are read from the venue's own response fields, never computed locally from takerDelayMs or from a provisional estimate.
source: skills/fin-exchange-integration/references/prediction-market-limitless.md:102
cases:
  - name: the returned eligibleAt does not equal submit time plus takerDelayMs
    expr: "abs((Decimal('1774000000000') + Decimal('3000')) - Decimal('1774000012500'))"
    op: gt
    value: "0"
    why: the old rule said eligibleAt is produced by takerDelayMs, which forces this difference to zero.
  - name: a locally computed release time fires 9.5 seconds early
    expr: "(Decimal('1774000012500') - (Decimal('1774000000000') + Decimal('3000'))) / Decimal('1000')"
    op: ge
    value: "9.5"
    why: a client releasing on its own clock acts before the venue has released the order.
  - name: a provisional fee estimate is not the terminal effective fee
    expr: "abs(Decimal('250') * Decimal('40') / Decimal('10000') - Decimal('250') * Decimal('175') / Decimal('10000'))"
    op: eq
    value: "3.375"
    why: booking the MATCHED estimate as final understates the fee on a 250 USDC taker fill by this amount.
  - name: a FAILED after a booked MATCHED leaves the whole fill as phantom notional
    expr: "Decimal('10') * Decimal('0.65')"
    op: eq
    value: "6.50"
    why: crediting a provisional MATCHED as cash leaves this notional on the books when the terminal frame is FAILED.
