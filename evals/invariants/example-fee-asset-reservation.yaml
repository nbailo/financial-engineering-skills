id: example-fee-asset-reservation
invariant: A resting order holds at least the largest fee any fill of it can be charged, in the asset the fee is charged in, and orders resting at once hold the sum of their worst cases.
source: examples/prediction-market-bot/safe_bot.py:157
cases:
  - name: a resting buy at 0.40 holds a worst-case fee rather than nothing
    expr: "Decimal('100') * Decimal('70000') * min(Decimal('400000'), Decimal('500000')) * (Decimal('1000000') - min(Decimal('400000'), Decimal('500000'))) / (Decimal('1000000') * Decimal('1000000'))"
    op: eq
    value: "1680000"
    why: the old rule held nothing in the fee asset, so this was zero and a fill could arrive with the fee unpayable.
  - name: the hold is taken at the price that maximises the fee, not at the resting price
    expr: "Decimal('100') * Decimal('70000') * min(Decimal('900000'), Decimal('500000')) * (Decimal('1000000') - min(Decimal('900000'), Decimal('500000'))) / (Decimal('1000000') * Decimal('1000000'))"
    op: eq
    value: "1750000"
    why: a hold taken at the 0.90 bid is 630000 and under-holds every fill between the midpoint and the bid.
  - name: the hold covers the worst fill that order can take
    expr: "Decimal('100') * Decimal('70000') * min(Decimal('900000'), Decimal('500000')) * (Decimal('1000000') - min(Decimal('900000'), Decimal('500000'))) / (Decimal('1000000') * Decimal('1000000')) - Decimal('100') * Decimal('70000') * Decimal('500000') * Decimal('500000') / (Decimal('1000000') * Decimal('1000000'))"
    op: ge
    value: "0"
    why: a hold taken at the resting price makes this negative by 1120000, which is fee the fill cannot pay.
  - name: two orders resting at once hold the sum of their worst cases
    expr: "Decimal('100') * Decimal('70000') * Decimal('400000') * Decimal('600000') / (Decimal('1000000') * Decimal('1000000')) + Decimal('50') * Decimal('70000') * min(Decimal('550000'), Decimal('500000')) * (Decimal('1000000') - min(Decimal('550000'), Decimal('500000'))) / (Decimal('1000000') * Decimal('1000000'))"
    op: eq
    value: "2555000"
    why: holding the larger of the two instead of the sum leaves 875000 of the second order's fee uncovered.
  - name: a 2 FPOINT balance cannot back both orders
    expr: "Decimal('2000000') - (Decimal('100') * Decimal('70000') * Decimal('400000') * Decimal('600000') / (Decimal('1000000') * Decimal('1000000')) + Decimal('50') * Decimal('70000') * min(Decimal('550000'), Decimal('500000')) * (Decimal('1000000') - min(Decimal('550000'), Decimal('500000'))) / (Decimal('1000000') * Decimal('1000000')))"
    op: lt
    value: "0"
    why: a hold that keeps only the larger of the two leaves 320000 free and rests a second order the balance cannot cover.
