id: exchange-exposure-and-fold-order
invariant: An unresolved order reserves the instrument's own worst-case exposure rather than a universal notional, and realized PnL is a function of the fills' canonical economic order, so only the weighted mean is permutation-invariant.
source: skills/fin-exchange-integration/SKILL.md:85
cases:
  - name: a short perp's loss runs past the notional the old rule reserved
    expr: "Decimal('10') * (Decimal('200000') - Decimal('50000'))"
    op: gt
    value: "500000"
    why: holding full notional (10 x 50000) under-reserves a short whose loss is unbounded above, so the risk gate opens on an account that is already past its own limit
  - name: a long call's worst case is the premium paid, not the underlying notional
    expr: "Decimal('10') * Decimal('100') * Decimal('2.50')"
    op: eq
    value: "2500"
    why: the old rule reserves 10 x 100 x 250.00 = 250000, a hundred times the most a long call holder can lose, which freezes capacity that is not at risk and gets the ladder switched off
  - name: the spot buy is the case where the two rules agree
    expr: "Decimal('0.5') * Decimal('50000')"
    op: eq
    value: "25000"
    why: a correction that stopped reserving notional on a spot buy would under-reserve the one product where notional is the worst case
  - name: FIFO realized PnL moves with the economic order of the two buys
    expr: "abs((Decimal('130') - Decimal('100')) - (Decimal('130') - Decimal('120')))"
    op: gt
    value: "0"
    why: SKILL.md:130 now demands canonical-order convergence; a test asserting realized PnL is invariant under an arbitrary permutation demands this difference be zero, which is false for buy 1@100, buy 1@120, sell 1@130
  - name: guessing an unestablishable order moves realized PnL by a material fraction of the sale
    expr: "((Decimal('130') - Decimal('100')) - (Decimal('130') - Decimal('120'))) / Decimal('130') * Decimal('100')"
    op: gt
    value: "15"
    why: where the venue's data cannot establish the canonical order, a guess shifts realized PnL by over 15% of the proceeds and nothing downstream disagrees with it, which is why the branch must reject
  - name: the weighted mean is the part that really is order-independent
    expr: "abs((Decimal('100') + Decimal('120')) / Decimal('2') - (Decimal('100') + Decimal('120') + Decimal('100')) / Decimal('3'))"
    op: gt
    value: "3"
    why: an incremental accumulator that re-applies a redelivered fill moves the average entry price by 3.33, so the surviving arrival-order invariance must be asserted on a fold over the persisted set
