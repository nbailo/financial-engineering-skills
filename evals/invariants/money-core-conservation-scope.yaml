id: money-core-conservation-scope
invariant: A conservation assertion holds only over a boundary nothing crosses unaccounted; every fee, accrual, mint, burn, external transfer and rounding residue is either outside the boundary or carried as an explicit term.
source: skills/fin-money-core/SKILL.md:93
cases:
  - name: accrual crosses the boundary, so the round trip legitimately returns more
    expr: "Decimal('100.00') * (Decimal('105.00') / Decimal('100.00')) - Decimal('100.00')"
    op: gt
    value: "0.00"
    why: the unscoped rule "no round trip returns more than it put in" fires on a correct yield-bearing pool, so it gets a tolerance bolted on and stops detecting a real leak
  - name: closed boundary, floor on both derived legs, no accrual between them
    expr: "((Decimal('13') * Decimal('40') / Decimal('57')).quantize(Decimal('1'), ROUND_DOWN) * (Decimal('57') + Decimal('13')) / (Decimal('40') + (Decimal('13') * Decimal('40') / Decimal('57')).quantize(Decimal('1'), ROUND_DOWN))).quantize(Decimal('1'), ROUND_DOWN) - Decimal('13')"
    op: lt
    value: "0"
    why: inverting either leg to ceil returns 14 for a 13 deposit, the repeatable extraction loop the direction table exists to close
  - name: a fee paid out of the transfer is a boundary crossing, not a break
    expr: "Decimal('100.00') - Decimal('98.50')"
    op: eq
    value: "1.50"
    why: an unscoped sum-to-zero over a transfer that pays a venue fee reports a 1.50 break on correct books
  - name: the same transfer with the fee carried as an explicit term
    expr: "Decimal('100.00') - Decimal('98.50') - Decimal('1.50')"
    op: eq
    value: "0.00"
    why: dropping the fee term leaves 1.50 unattributed, which is how a fee account silently absorbs a real loss
  - name: flooring every payout leg as a default leaves part of an exact liability unpaid
    expr: "Decimal('10.00') - Decimal('3') * (Decimal('10.00') / Decimal('3')).quantize(Decimal('0.01'), ROUND_DOWN)"
    op: eq
    value: "0.01"
    why: a universal "floor payouts, ceil collections" default pays 9.99 against a 10.00 liability and gives the cent to nobody
  - name: the same split with the residue posted to a named owner
    expr: "Decimal('3') * (Decimal('10.00') / Decimal('3')).quantize(Decimal('0.01'), ROUND_DOWN) + Decimal('0.01') - Decimal('10.00')"
    op: eq
    value: "0.00"
    why: a residue computed and then discarded is an unbalanced set of postings that no later reconciliation can attribute
