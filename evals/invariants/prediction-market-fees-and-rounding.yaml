id: prediction-market-fees-and-rounding
invariant: A binary buy at price p held to a certain settlement of 1 survives a fee only against the base that fee is quoted on, f*p < 1-p on notional and f < 1-p on payout, and a per-fill ceiling makes the fee super-additive only across children identical in price, role, schedule, asset, fee function and rounding.
source: skills/fin-exchange-integration/references/prediction-market-core.md:241
cases:
  - name: a 1 percent notional fee at p = 0.99 is EV-positive at certainty
    expr: "Decimal('100') * Decimal('1') - Decimal('100') * Decimal('0.99') - Decimal('0.01') * Decimal('100') * Decimal('0.99')"
    op: gt
    value: "0"
    why: the old rule called this trade EV-negative at every true probability, certainty included; it nets +$0.01 on 100 shares
  - name: the notional break-even rate at p = 0.99 is above 1 percent
    expr: "(Decimal('1') - Decimal('0.99')) / Decimal('0.99')"
    op: gt
    value: "0.01"
    why: a threshold pinned at the quoted 1 percent rejects a trade that is marginally profitable, and the true threshold is 0.01/0.99
  - name: the same 1 percent quoted on payout breaks even exactly
    expr: "Decimal('100') * Decimal('1') - Decimal('100') * Decimal('0.99') - Decimal('0.01') * Decimal('100') * Decimal('1')"
    op: eq
    value: "0"
    why: carrying a rate between the notional and the payout base without renaming it, which differs by a factor of p
  - name: identical children at one price pay more under a per-fill centicent ceiling
    expr: "Decimal('100') * Decimal('0.000693').quantize(Decimal('0.0001'), rounding=ROUND_UP) - Decimal('0.0693').quantize(Decimal('0.0001'), rounding=ROUND_UP)"
    op: gt
    value: "0"
    why: a pre-trade estimate that ignores the per-fill ceiling under-reserves the fee on a sliced order
  - name: a maker leg on a taker-only schedule makes splitting cheaper
    expr: "Decimal('0') + Decimal('50') * Decimal('0.07') * Decimal('0.99') * Decimal('0.01') - Decimal('100') * Decimal('0.07') * Decimal('0.99') * Decimal('0.01')"
    op: lt
    value: "0"
    why: the old unscoped claim asserts sliced fees never fall below the single-fill fee, so it fires on a correct implementation where one child rests as maker
