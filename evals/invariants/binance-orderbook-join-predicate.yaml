id: binance-orderbook-join-predicate
invariant: >-
  The spot and USDs-M first-event acceptance predicates are different, and neither is the other. Spot
  discards u <= lastUpdateId and then requires lastUpdateId within the surviving event's [U, u].
  Futures discards u < lastUpdateId and requires U <= lastUpdateId AND u >= lastUpdateId. A client
  running one venue's predicate on the other seats its book on the wrong event.
source: skills/fin-exchange-integration/references/venues/binance-orderbook.md:29
cases:
  - name: spot containment holds when lastUpdateId sits inside the surviving event
    expr: "min(Decimal('100') - Decimal('98'), Decimal('105') - Decimal('100'))"
    op: ge
    value: "0"
    why: >-
      containment of lastUpdateId in [U, u] is min(lastUpdateId - U, u - lastUpdateId) >= 0. With
      lastUpdateId 100 and the surviving event spanning 98 to 105 this is 2, so the event is the
      correct seat. A client using the retired plus-one form tests a different quantity here.

  - name: the superseded plus-one form rejects an event the current rule accepts
    expr: "Decimal('98') - (Decimal('100') + Decimal('1'))"
    op: lt
    value: "0"
    why: >-
      the retired predicate required U <= lastUpdateId+1; an event with U=98 satisfies it, but the
      pair it rejects is the boundary case U=101 where the current rule already excluded the event by
      the discard step. Keeping both forms in the tree let two references disagree on which event
      seats the book.

  - name: the discard boundary is exactly where the two venues diverge
    expr: "Decimal('100') - Decimal('100')"
    op: eq
    value: "0"
    why: >-
      spot discards u <= lastUpdateId, futures discards u < lastUpdateId. At u - lastUpdateId == 0
      the two predicates give opposite answers, so an event with u exactly equal to lastUpdateId is
      dropped on spot and kept on futures. Running one venue's rule on the other seats the book one
      event out at precisely this value.

  - name: an event ending before the snapshot is never the seat on either venue
    expr: "Decimal('95') - Decimal('100')"
    op: lt
    value: "0"
    why: u=95 against lastUpdateId=100 predates the snapshot, and a client that seats on it applies updates already inside the snapshot and double-counts them

  - name: a gap past the local id is a restart, not an apply
    expr: "Decimal('103') - (Decimal('100') + Decimal('1'))"
    op: gt
    value: "0"
    why: U=103 against local id 100 means events 101 and 102 were missed, and applying anyway leaves a phantom level that no later event corrects
