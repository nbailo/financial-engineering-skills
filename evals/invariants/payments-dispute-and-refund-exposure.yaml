id: payments-dispute-and-refund-exposure
invariant: refunds already made, refunds in flight and open or lost claims are one combined exposure against a single capture, and their total can never exceed the captured amount
source: skills/fin-payments/references/refunds.md:36
cases:
  - name: an open same-currency claim leaves the unclaimed remainder refundable
    expr: "max(Decimal('0'), Decimal('9000') - Decimal('2000') - Decimal('1500') - Decimal('4000'))"
    op: eq
    value: "1500"
    why: the blanket block returned 0 here and stranded a refund the customer was owed, which is then issued by hand outside every ceiling
  - name: refunding the whole ceiling returns exactly what was captured, never more
    expr: "Decimal('9000') - (Decimal('2000') + Decimal('1500') + Decimal('4000') + Decimal('1500'))"
    op: eq
    value: "0"
    why: a ceiling that lets refunds plus claims exceed the capture pays the customer twice, once as a refund and once as a chargeback
  - name: dropping the claim term over-returns by the whole claim
    expr: "Decimal('9000') - (Decimal('2000') + Decimal('1500') + Decimal('4000') + Decimal('5500'))"
    op: lt
    value: "0"
    why: a ceiling computed without the open claim admits a 5500 refund and returns 13000 against a 9000 capture
  - name: a fully claimed capture leaves nothing refundable
    expr: "max(Decimal('0'), Decimal('9000') - Decimal('0') - Decimal('0') - Decimal('9000'))"
    op: eq
    value: "0"
    why: the full-chargeback case, where any further refund is a second return of money already returned
  - name: a partial claim on an otherwise untouched capture stays partly refundable
    expr: "max(Decimal('0'), Decimal('10000') - Decimal('0') - Decimal('0') - Decimal('3000'))"
    op: eq
    value: "7000"
    why: the blanket block refuses this refund outright though 7000 of the capture is under no claim at all
