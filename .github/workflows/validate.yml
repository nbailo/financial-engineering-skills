name: validate

on: [push, pull_request]

# Read-only for the whole workflow. Nothing here writes to the repository, opens an issue or
# publishes an artifact, so no job raises it. Stating it at workflow level means a job added
# later starts read-only rather than inheriting whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  spec-and-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this the job token is written into .git/config, where every later step
          # and everything those steps execute can read it. Nothing after checkout talks to
          # the remote, so the credential has no reason to survive the step.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # PyYAML enables the strict frontmatter check. Without it the validator falls back to a
      # lenient parser that accepts frontmatter real loaders reject. --require-hashes refuses
      # any artifact whose SHA-256 is not in requirements.txt, so a compromised index or a
      # mirror serving a different file fails the install instead of executing in the job.
      - run: pip install --require-hashes -r requirements.txt
      # Enforces the Agent Skills spec (frontmatter keys, name rules, description
      # limits), the repo budgets declared as constants in scripts/validate.py, the
      # shared section shape of the six installed skills, and that every cross-skill
      # invariant citation resolves in fin-money-core. The numbers live in the
      # validator and are deliberately not restated here.
      - run: python3 scripts/validate.py
      - run: python3 scripts/lint_routing_lexical.py
      # examples/prediction-market-bot/ is executable, not prose: a fake in-process venue,
      # a safe bot, a counter-example, and a frozen event log. The runner is unittest, so it
      # adds no dependency, and its network guard raises on any socket, name lookup or
      # connection attempt, which is what stops a live call being reintroduced quietly.
      - run: python3 examples/prediction-market-bot/run_tests.py
      # The behavioral eval dataset, checked with no model in the loop. For each case it runs the
      # hidden oracle against the planted defect and requires a FAILURE, then applies the reference
      # fix and requires a PASS. A fixture that passes on its own defect measures nothing and a
      # model scores it by changing nothing; one that cannot pass after the reference fix cannot be
      # won. Both are dataset bugs and both are caught here.
      - run: python3 scripts/check_eval_dataset.py
      # The paired evaluator's own tests, with every HTTP response mocked. They also prove no real
      # OpenAI call can happen: socket.socket is replaced before the module is imported, so a code
      # path that reaches for the network raises instead of dialling. scripts/run_patch_eval.py is
      # paid and manual, and nothing in CI invokes it.
      - run: python3 -m unittest tests.test_patch_eval

  workflow-hygiene:
    # The checks SECURITY.md cites by name: SHA pins with their release tag, read-only
    # workflow permissions, a timeout on every job, persist-credentials: false on every
    # checkout, --require-hashes on every pip install, and the quiet Dependabot posture.
    # Without this job those statements would be prose that nothing keeps true.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python3 scripts/check_workflows.py

  shellcheck:
    # scripts/install-guardrails.sh edits files in someone else's repository. A quoting bug
    # there is a data-loss bug in a stranger's AGENTS.md, and the round-trip test below proves
    # behaviour on three inputs, not the absence of the class.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck every shell script
        run: |
          set -euo pipefail
          # shellcheck ships in the GitHub hosted Ubuntu image (0.9.0-1 on ubuntu-24.04, per
          # actions/runner-images images/ubuntu/Ubuntu2404-Readme.md at 564e58d). Nothing here
          # installs it: if a future image drops it, this step fails loudly instead of
          # skipping the check and reporting green. The version is printed so a rule that
          # only exists in a newer release is visible in the log.
          shellcheck --version
          # Every tracked shell script, not a list that a new script can be added beside.
          git ls-files -z '*.sh' | xargs -0 -r shellcheck --

  routing-block-installer:
    # scripts/install-guardrails.sh writes into files it did not create, in a repository that
    # is not ours. This suite is the evidence for every guarantee its header states: refusal
    # of symlinks, non-regular files, multiply linked files and unbalanced markers; unique
    # temporary files inside the destination; preserved modes and preserved bytes outside the
    # block; replacement by rename; full rollback after a partial failure and after a signal;
    # and a byte-identical install-then-uninstall round trip. It runs on both userlands the
    # script claims to support, because the BSD and GNU behaviours of stat, find and mktemp
    # differ in ways that a Linux-only run would not catch.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hostile installer suite
        run: ./scripts/test-install-guardrails.sh
