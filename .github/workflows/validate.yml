name: validate
on: [push, pull_request]
jobs:
  spec-and-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Enforces the Agent Skills spec (frontmatter keys, name rules, description
      # limits) and this repo's budgets: 500 lines per SKILL.md, 8KB for AGENTS.md,
      # 3000 chars of description across the suite.
      - run: python3 scripts/validate.py
  guardrails-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install is idempotent and uninstall is a clean round-trip
        run: |
          set -euo pipefail
          mkdir -p /tmp/host && printf '# Host\n\npara one\n\npara two\n' > /tmp/host/AGENTS.md
          cp /tmp/host/AGENTS.md /tmp/original
          ./scripts/install-guardrails.sh /tmp/host
          a=$(sha256sum < /tmp/host/AGENTS.md)
          ./scripts/install-guardrails.sh /tmp/host
          b=$(sha256sum < /tmp/host/AGENTS.md)
          [ "$a" = "$b" ] || { echo "install is not idempotent"; exit 1; }
          ./scripts/install-guardrails.sh --uninstall /tmp/host
          diff /tmp/original /tmp/host/AGENTS.md || { echo "uninstall is not a clean round-trip"; exit 1; }
          echo "ok"
