name: secret-scan

# Scans only what the event adds. The full-history scan is scripts/secret-scan.sh with no
# arguments, run by hand once before a release: it is the mode that can still catch a
# credential committed before this workflow existed, and it is too slow to run on every push
# without someone eventually turning it off. Scanning the range is what can still be fixed
# before the commit is published; scanning the history is what has to be rotated.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  changed-range:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both endpoints of the range have to exist in the clone. Under the default shallow
          # fetch the base commit is missing, and the script treats a missing endpoint as a
          # hole rather than as an empty result: it exits 2 instead of reporting green.
          fetch-depth: 0
          persist-credentials: false
      - name: scan the commits this event adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$zero" ] \
             || ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            # A new branch, or a push whose base is no longer in this clone. There is no
            # range to scan, so scan the tree that was pushed rather than report nothing.
            echo "no usable base commit for this event; scanning the checked-out tree"
            scripts/secret-scan.sh --tree
          else
            scripts/secret-scan.sh --range "${BASE}..${HEAD_SHA}"
          fi
