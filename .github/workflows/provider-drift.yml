name: provider-drift

# Reports the age of the evidence behind every provider and protocol reference. It reads,
# it prints, and it stops there.
#
# It deliberately does NOT open an issue, commit, or touch a file. A provenance block records
# that a human read a named source on a named date. Only another human reading that source
# again may move verified_at, and a job that edited the date would destroy the single fact the
# block exists to carry: not "this file was checked by CI", but "a person read this URL on
# this day". Automating the date would turn honest evidence into a timestamp nobody stands
# behind. When something here is stale, a maintainer re-reads the source and files the report
# by hand; .github/ISSUE_TEMPLATE/provider-drift.md is the shape for that.
#
# The output lands in the job summary so it is readable without opening logs.
#
# THE JOB FAILS WHEN A REQUIRED SOURCE IS STALE, and that is a deliberate reversal. It used to
# exit 0 whatever it found, on the argument that a red cross on a scheduled job trains people
# to ignore it. The argument is real and the cost of the alternative is worse: a report that is
# green while its evidence is stale converts "nobody has looked" into "somebody checked", which
# is the exact failure this repository exists to argue against. The report classifies every
# provenance block as currently revalidated, sourced but revalidation pending, or illustrative
# or historical only, and fails on the middle state. Clearing it takes one of two honest acts,
# both by a person: re-read the source and move verified_at, or declare the file
# `classification: illustrative` and stop presenting it as a current claim.
#
# The summary is published whether the report passes or fails, so a red run is still readable.

on:
  schedule:
    # 07:00 UTC every Monday. Weekly, because the venues this repo pins ship changelog
    # entries most weeks and a monthly cadence would let a whole quarter of drift accumulate
    # behind one report.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Call a provenance block stale after this many days'
        required: false
        default: '90'

permissions:
  contents: read

jobs:
  evidence-age:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job reads and prints. It never pushes, so the job token has no reason to
          # stay in .git/config after the checkout step ends.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # --require-hashes refuses any artifact whose SHA-256 is not in requirements.txt.
      - run: pip install --require-hashes -r requirements.txt
      - name: report evidence age
        id: report
        env:
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '90' }}
        # pipefail is what makes the step carry the report's verdict rather than tee's. The
        # report writes drift-report.txt before it exits, so the summary step below still has
        # the whole thing to publish on a failing run.
        run: |
          set -euo pipefail
          python3 scripts/validate.py --provenance-report --max-age-days "$MAX_AGE_DAYS" \
            | tee drift-report.txt
      - name: publish to the job summary
        if: always()
        run: |
          {
            echo '## Provider evidence age'
            echo
            echo 'This job never edits a verified_at date, opens an issue, or commits. It'
            echo 'fails when a required source is past its revalidation trigger, and the only'
            echo 'two things that clear it are done by a person: re-read the source and move'
            echo 'the date, or declare the file illustrative and stop citing it as current.'
            echo
            echo '```'
            cat drift-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
